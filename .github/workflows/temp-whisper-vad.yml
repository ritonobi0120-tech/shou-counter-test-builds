name: Temporary Whisper VAD model fetch

on:
  pull_request:
    branches: [main]
    paths:
      - .github/whisper-vad-fetch-trigger

permissions:
  contents: read

jobs:
  fetch-vad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify Silero VAD model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors \
            -o ggml-silero-v6.2.0.bin \
            "https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin"
          echo "2aa269b785eeb53a82983a20501ddf7c1d9c48e33ab63a41391ac6c9f7fb6987  ggml-silero-v6.2.0.bin" | sha256sum -c -

      - name: Upload VAD model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-silero-v6.2.0
          path: ggml-silero-v6.2.0.bin
          if-no-files-found: error
          retention-days: 1
