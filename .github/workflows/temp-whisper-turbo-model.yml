name: Temporary Whisper Turbo model fetch

on:
  pull_request:
    branches: [main]
    paths:
      - .github/whisper-turbo-fetch-trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and verify Whisper Large v3 Turbo Q5_0
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors \
            -o ggml-large-v3-turbo-q5_0.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin"
          echo "394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2  ggml-large-v3-turbo-q5_0.bin" | sha256sum -c -
          split -b 250M -d -a 2 ggml-large-v3-turbo-q5_0.bin turbo.part.
          ls -lh ggml-large-v3-turbo-q5_0.bin turbo.part.*

      - name: Upload model part 00
        uses: actions/upload-artifact@v4
        with:
          name: whisper-turbo-part-00
          path: turbo.part.00
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload model part 01
        uses: actions/upload-artifact@v4
        with:
          name: whisper-turbo-part-01
          path: turbo.part.01
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload model part 02
        uses: actions/upload-artifact@v4
        with:
          name: whisper-turbo-part-02
          path: turbo.part.02
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
