name: Temporary Whisper model fetch

on:
  pull_request:
    branches: [main]
    paths:
      - .github/whisper-model-fetch-trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify Whisper Small Q5_1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors \
            -o ggml-small-q5_1.bin \
            "https://github.com/w3xgroup/taskurio-models/releases/download/whisper-models-v1/ggml-small-q5_1.bin"
          echo "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  ggml-small-q5_1.bin" | sha256sum -c -
          ls -lh ggml-small-q5_1.bin

      - name: Upload verified model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5_1-model
          path: ggml-small-q5_1.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
